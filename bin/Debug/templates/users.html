<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Users and Roles</title><link href="/static/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-dark px-3 justify-content-between mb-4"><a class="navbar-brand" href="/dashboard">System Control Center</a><span class="text-white">{{ username }} <span class="badge bg-secondary">admin</span> <a href="/logout" class="btn btn-sm btn-danger ms-2">Logout</a></span></nav><main class="container"><div class="d-flex justify-content-between align-items-center mb-4"><h1>Users and Roles</h1><button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addUserModal">Create user</button></div><div class="card shadow-sm"><div class="card-body"><div class="table-responsive"><table class="table table-hover align-middle m-0"><thead class="table-dark"><tr>{% for col in columns %}<th>{{ col }}</th>{% endfor %}<th>Actions</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{ row.id }}</td><td><strong>{{ row.username }}</strong></td><td>{{ row.email }}</td><td><span class="badge bg-secondary">{{ row.role }}</span></td><td>{{ row.created_at }}</td><td><button class="btn btn-sm btn-warning edit-user" data-bs-toggle="modal" data-bs-target="#editUserModal" data-id="{{ row.id }}" data-username="{{ row.username }}" data-email="{{ row.email }}" data-role="{{ row.role }}">Edit</button> <form action="/users/delete/{{ row.id }}" method="POST" class="d-inline" onsubmit="return confirm('Delete this user?');"><button class="btn btn-sm btn-danger" type="submit">Delete</button></form></td></tr>{% endfor %}</tbody></table></div></div></div></main><div class="modal fade" id="addUserModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Create user</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><form action="/users/create" method="POST"><div class="modal-body"><label class="form-label">Username</label><input class="form-control mb-3" name="username" required><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Role</label><select class="form-select mb-3" name="role" required><option value="viewer">Viewer</option><option value="operator">Operator</option><option value="admin">Administrator</option></select><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="8" required></div><div class="modal-footer"><button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancel</button><button class="btn btn-success" type="submit">Save user</button></div></form></div></div></div><div class="modal fade" id="editUserModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Edit user</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><form action="/users/update" method="POST"><div class="modal-body"><input type="hidden" name="id" id="user-id"><label class="form-label">Username</label><input class="form-control mb-3" name="username" id="user-name" required><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" id="user-email" required><label class="form-label">Role</label><select class="form-select mb-3" name="role" id="user-role" required><option value="viewer">Viewer</option><option value="operator">Operator</option><option value="admin">Administrator</option></select><label class="form-label">New password <span class="text-muted">(optional)</span></label><input class="form-control" type="password" name="password" minlength="8" placeholder="Leave blank to keep current password"></div><div class="modal-footer"><button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancel</button><button class="btn btn-warning" type="submit">Save changes</button></div></form></div></div></div><script src="/static/bootstrap.bundle.min.js"></script><script>document.querySelectorAll('.edit-user').forEach(function(button){button.addEventListener('click',function(){document.getElementById('user-id').value=this.dataset.id;document.getElementById('user-name').value=this.dataset.username;document.getElementById('user-email').value=this.dataset.email;document.getElementById('user-role').value=this.dataset.role;});});</script></body></html>
<script>document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('.navbar-brand').forEach(function(link){if(!link.textContent.trim().startsWith('\u2190'))link.textContent='\u2190 '+link.textContent.trim();});});</script>
<script>document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('form[method="POST"]').forEach(function(form){const token=document.createElement('input');token.type='hidden';token.name='csrf_token';token.value='{{ csrf_token }}';form.appendChild(token);});});</script>
